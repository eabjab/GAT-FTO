[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gat-frontier-exploration"
version = "0.1.0"
description = "Graph Attention Networks for Frontier Tour Optimization (GAT-FTO)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "networkx>=3.1",
    "matplotlib>=3.7.0",
    "pytest>=7.4.0",
]

[tool.setuptools]
py-modules = ["config", "evaluate"]

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "models*", "rl*", "baselines*", "visualization*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
